version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    # Supply-chain cooldown: hold newly published versions for 7 days so a
    # compromised release can be detected/yanked before it's proposed. The
    # first-party @get2knowio/* scope is exempt.
    cooldown:
      default-days: 7
      exclude:
        - "@get2knowio/*"
    reviewers:
      - "pofallon"
    assignees:
      - "pofallon"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    reviewers:
      - "pofallon"
    assignees:
      - "pofallon"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"